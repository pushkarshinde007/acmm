<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <rect width="400" height="240" rx="16" fill="#161E2D"/>
  <defs>
    <linearGradient id="aws-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#161E2D" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="16" fill="url(#aws-glow)"/>
  <g transform="translate(80, 50)">
    <!-- AWS Logo -->
    <text x="120" y="80" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="-2" text-anchor="middle">aws</text>
    <!-- Amazon Smile Arrow -->
    <path d="M 48 95 C 90 122 150 122 192 95" fill="none" stroke="#FF9900" stroke-width="6" stroke-linecap="round"/>
    <path d="M 184 88 L 195 96 L 180 102 Z" fill="#FF9900"/>
  </g>
  <rect x="30" y="182" width="340" height="28" rx="6" fill="#FF9900" fill-opacity="0.12"/>
  <text x="200" y="201" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFB84D" text-anchor="middle" letter-spacing="1.5">AMAZON WEB SERVICES</text>
</svg>