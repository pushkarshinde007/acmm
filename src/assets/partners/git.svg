<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <rect width="400" height="240" rx="16" fill="#1E1E1E"/>
  <defs>
    <linearGradient id="git-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F05032" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1E1E1E" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="16" fill="url(#git-glow)"/>
  <g transform="translate(120, 50)">
    <!-- Diamond -->
    <rect x="25" y="25" width="65" height="65" rx="12" fill="#F05032" transform="rotate(45 57 57)"/>
    <!-- Git Branch Line -->
    <circle cx="42" cy="57" r="6" fill="#FFFFFF"/>
    <circle cx="72" cy="42" r="6" fill="#FFFFFF"/>
    <circle cx="72" cy="72" r="6" fill="#FFFFFF"/>
    <path d="M 42 57 L 72 42 M 42 57 L 72 72" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <!-- Text -->
    <text x="130" y="72" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1">git</text>
  </g>
  <rect x="30" y="182" width="340" height="28" rx="6" fill="#F05032" fill-opacity="0.12"/>
  <text x="200" y="201" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FF856D" text-anchor="middle" letter-spacing="1.5">FAST VERSION CONTROL</text>
</svg>